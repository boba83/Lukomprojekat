<svg width="80" height="48" viewBox="0 0 80 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="80" height="48" rx="12" fill="url(#bgGradient)"/>

  <!-- Outer arc -->
  <path
    d="M12 34C13.5 23 22.5 14 34 11C41 9.5 49 9.5 56 11C67.5 14 76.5 23 78 34"
    stroke="#f97316"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Inner arc (darker) -->
  <path
    d="M16 34C17.2 25 24 18 33 16.2C39 15 47 15 53 16.2C62 18 68.8 25 70 34"
    stroke="#111827"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Ticks -->
  <line x1="26" y1="24" x2="24" y2="20" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="22" x2="40" y2="18" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="24" x2="56" y2="20" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>

  <!-- Needle -->
  <circle cx="40" cy="30" r="3" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
  <path
    d="M40 30 L58 18"
    stroke="#f97316"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Small highlight on needle -->
  <path
    d="M40 30 L54 20"
    stroke="#fee2e2"
    stroke-width="1.4"
    stroke-linecap="round"
  />

  <!-- Ground line -->
  <line x1="14" y1="36" x2="66" y2="36" stroke="#020617" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="80" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
</svg>

